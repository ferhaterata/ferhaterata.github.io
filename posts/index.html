<!-- marked.js converts Markdown → HTML; KaTeX auto-render finds $...$ and $$...$$ and renders TeX. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- highlight.js core + COBOL grammar for syntax highlighting in code fences.
     COBOL isn't in the @highlightjs/cdn-assets bundle, and the
     highlightjs-cobol package is ESM-only — so fetch it via dynamic
     import and register it after hljs is loaded. -->
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script type="module">
  try {
    const mod = await import("https://cdn.jsdelivr.net/npm/highlightjs-cobol/src/cobol.js");
    if (window.hljs && mod.default) {
      // The upstream grammar assumes fixed-format COBOL and treats
      // columns 1–6 as a sequence-number comment, which mangles our
      // free-format snippets. Wrap the language factory to drop those
      // rules before hljs sees them.
      const factory = (hljs) => {
        const def = mod.default(hljs);
        def.contains = (def.contains || []).filter((r) => {
          const src = r?.begin?.source ?? String(r?.begin ?? "");
          return !src.startsWith("(^[ 0-9a-zA-Z]{1,6}");
        });
        return def;
      };
      window.hljs.registerLanguage("cobol", factory);
      // If the essay renderer already ran before this module resolved,
      // the elements will be marked as highlighted (`data-highlighted`
      // and `hljs` class) — reset them so hljs re-highlights with the
      // now-registered cobol grammar.
      document.querySelectorAll(".essay pre code.language-cobol").forEach((el) => {
        el.removeAttribute("data-highlighted");
        el.classList.remove("hljs");
        el.textContent = el.textContent;
        try { window.hljs.highlightElement(el); } catch (_) {}
      });
    }
  } catch (_) { /* grammar is a progressive enhancement */ }
</script>
<script>
(async function () {
  // Version-pin the JSON fetch so browsers see updates. Bump when
  // posts.json changes — matches the JSON_VERSION convention used by
  // app.js's fetchJSON helper.
  const res = await fetch("../posts.json?v=2026-07-12").then((r) => r.json()).catch(() => ({ posts: [] }));
  const posts = res.posts || [];

  const listEl = document.getElementById("posts-list");
  const listingView = document.getElementById("posts-listing");
  const essayView = document.getElementById("essay-view");

  const renderListing = () => {
    essayView.hidden = true;
    listingView.hidden = false;
    if (!posts.length) {
      listEl.innerHTML = `<p class="empty-state">No essays yet. Check back soon.</p>`;
      return;
    }
    // Entries with `url` are external artifacts (slide decks, demos)
    // — link straight at them; otherwise route into the hash-based
    // markdown renderer.
    listEl.innerHTML = posts.map((p) => {
      const href = p.url ? p.url : `#${p.slug}`;
      const dateLine = `${p.date || ""}${p.kicker ? ` · ${p.kicker}` : ""}`;
      return `
      <a class="post-card" href="${href}">
        <span class="post-card-date">${dateLine}</span>
        <h3 class="post-card-title">${p.title}</h3>
        <p class="post-card-excerpt">${p.excerpt || ""}</p>
      </a>`;
    }).join("");
  };

  const renderEssay = async (slug) => {
    const meta = posts.find((p) => p.slug === slug);
    if (!meta) { renderListing(); return; }
    // External artifacts (slide decks etc.) don't route through
    // the markdown renderer — just navigate.
    if (meta.url) { window.location.href = meta.url; return; }
    const md = await fetch(`${slug}/index.md`).then((r) => r.ok ? r.text() : "").catch(() => "");
    if (!md) { renderListing(); return; }

    document.getElementById("essay-kicker").textContent = `${meta.date || ""}${meta.kicker ? " · " + meta.kicker : ""}`;
    document.getElementById("essay-title").textContent = meta.title;
    document.getElementById("essay-lede").textContent = meta.excerpt || "";
    const body = document.getElementById("essay-body");

    // Protect math from Markdown — replace $$…$$ and $…$ with placeholders,
    // run marked, then swap placeholders back in before KaTeX renders.
    const stash = [];
    const protect = (src) => src
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
        stash.push({ display: true, tex });
        return `@@MATH${stash.length - 1}@@`;
      })
      .replace(/(?<!\\)\$([^$\n]+?)\$/g, (_, tex) => {
        stash.push({ display: false, tex });
        return `@@MATH${stash.length - 1}@@`;
      });

    const rendered = window.marked.parse(protect(md));
    body.innerHTML = rendered.replace(/@@MATH(\d+)@@/g, (_, i) => {
      const { display, tex } = stash[Number(i)];
      try {
        return window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
      } catch (e) {
        return `<code>${tex}</code>`;
      }
    });
    // Rewrite relative image/figure paths so they resolve inside the
    // essay's own folder (posts/<slug>/…) rather than against /posts/.
    body.querySelectorAll("img[src], a[href]").forEach((el) => {
      const attr = el.tagName === "IMG" ? "src" : "href";
      const v = el.getAttribute(attr);
      if (!v) return;
      // Leave absolute URLs, site-relative paths, anchors, and protocol URLs alone.
      if (/^([a-z]+:|\/|#)/i.test(v)) return;
      el.setAttribute(attr, `${slug}/${v}`);
    });
    // Syntax-highlight code fences (COBOL, etc.) via highlight.js.
    if (window.hljs) {
      body.querySelectorAll("pre code[class*='language-']").forEach((el) => {
        try { window.hljs.highlightElement(el); } catch (_) {}
      });
    }
    listingView.hidden = true;
    essayView.hidden = false;
    window.scrollTo(0, 0);
  };

  const route = () => {
    const slug = location.hash.replace(/^#/, "");
    if (slug) renderEssay(slug);
    else renderListing();
  };

  window.addEventListener("hashchange", route);
  route();
})();
</script>
