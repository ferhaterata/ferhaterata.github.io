<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Recovering a count from shared summaries</title>
  <desc id="desc">In the toy example, transformed inputs use the sum c plus d at t equals 1 and the difference c minus d at t equals negative 1. The values 17 and 1, together with derivative 10, recover the original count 8.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#f8fafd"/>
  <g font-family="'Roboto Flex', Roboto, Arial, sans-serif">
    <text x="40" y="49" fill="#526174" font-size="16" font-weight="600" letter-spacing="1.2">A SMALL COUNTING EXAMPLE</text>
    <text x="40" y="88" fill="#172b4d" font-size="29" font-weight="600">Change the inputs. Separate the sums. Recover the count.</text>
    <g fill="#ffffff" stroke="#d7e1ef" stroke-width="1.5">
      <rect x="40" y="121" width="250" height="215" rx="12"/>
      <rect x="354" y="121" width="250" height="215" rx="12"/>
      <rect x="668" y="121" width="250" height="215" rx="12"/>
    </g>
    <g stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M304 228H338"/>
      <path d="M618 228H652"/>
    </g>
    <g fill="#526174" font-size="16" font-weight="600">
      <text x="62" y="155">TRANSFORM</text>
      <text x="376" y="155">SHARED SUMMARIES</text>
      <text x="690" y="155">INTERPOLATE</text>
    </g>
    <g fill="#172b4d" font-size="27">
      <text x="62" y="204">c → c + t d</text>
      <text x="62" y="243">d → d + t c</text>
    </g>
    <text x="62" y="302" fill="#526174" font-size="18">Original inputs at t = 0</text>
    <g fill="#172b4d" font-size="24">
      <text x="376" y="204">t = 1:  c + d</text>
      <text x="376" y="243">t = −1:  c − d</text>
    </g>
    <text x="376" y="280" fill="#526174" font-size="18">H(1) = 17, H(−1) = 1</text>
    <text x="376" y="306" fill="#526174" font-size="18">Derivative H′(1) = 10</text>
    <text x="692" y="240" fill="#1a73e8" font-size="49" font-weight="600">H(0) = 8</text>
    <text x="690" y="280" fill="#526174" font-size="18">(3 × 17 + 1 − 2 × 10) / 4</text>
    <text x="690" y="306" fill="#526174" font-size="18">The exact model count</text>
    <text x="40" y="374" fill="#526174" font-size="17">The transformed values are algebraic sums; they need not count Boolean solutions.</text>
  </g>
</svg>
