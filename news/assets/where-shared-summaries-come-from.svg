<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">Constructing a shared summary</title>
  <desc id="desc">Two swaps of four coordinates expose the shared correction a minus b minus c plus d. A polynomial replacement cancels the remaining cross-group terms at two evaluation points.</desc>
  <rect width="320" height="200" fill="#f4f8ff"/>
  <g fill="#fff" stroke="#8ab4f8" stroke-width="2">
    <rect x="18" y="20" width="110" height="108" rx="9"/>
    <rect x="171" y="37" width="132" height="76" rx="9"/>
  </g>
  <g stroke="#8ab4f8" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M50 54H95M50 95H95M51 54V94M95 54V94"/>
    <path d="m88 49 7 5-7 5M57 90l-7 5 7 5"/>
    <path d="M133 74H162m-7-5 7 5-7 5"/>
  </g>
  <g fill="#e8f0fe" stroke="#8ab4f8" stroke-width="1.5">
    <circle cx="49" cy="52" r="17"/><circle cx="96" cy="52" r="17"/>
    <circle cx="49" cy="96" r="17"/><circle cx="96" cy="96" r="17"/>
  </g>
  <g font-family="'Roboto Flex', Roboto, Arial, sans-serif" text-anchor="middle" fill="#185abc">
    <g font-size="22"><text x="49" y="59">a</text><text x="96" y="59">b</text><text x="49" y="103">c</text><text x="96" y="103">d</text></g>
    <text x="237" y="60" font-size="11">SHARED CORRECTION</text>
    <text x="237" y="89" font-size="20">a − b − c + d</text>
    <text x="72" y="147" font-size="12">fixed swaps</text>
    <text x="237" y="147" font-size="12">one measurement</text>
  </g>
  <path d="M26 164H294" fill="none" stroke="#d2e3fc"/>
  <text x="160" y="186" text-anchor="middle" fill="#185abc" font-size="14" font-family="'Roboto Flex', Roboto, Arial, sans-serif">construct → cancel → separate</text>
</svg>
