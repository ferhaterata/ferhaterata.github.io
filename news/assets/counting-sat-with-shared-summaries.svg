<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">Shared summaries and interpolation</title>
  <desc id="desc">Two summaries, c plus d and c minus d, feed a polynomial reconstruction. Two sample points and a tangent determine a curve whose highlighted middle value is the exact count H(0) equals 8.</desc>
  <rect width="320" height="200" fill="#f4f8ff"/>
  <!-- The two easy evaluation points use different linear summaries. -->
  <g fill="#e8f0fe" stroke="#8ab4f8" stroke-width="2">
    <rect x="14" y="29" width="95" height="58" rx="8"/>
    <rect x="14" y="113" width="95" height="58" rx="8"/>
  </g>
  <g fill="#185abc" font-family="'Roboto Flex', Roboto, Arial, sans-serif" text-anchor="middle">
    <g font-size="12">
      <text x="61.5" y="47">t = 1</text>
      <text x="61.5" y="131">t = −1</text>
    </g>
    <g font-size="25">
      <text x="61.5" y="75">c + d</text>
      <text x="61.5" y="159">c − d</text>
    </g>
  </g>
  <!-- Combine the local computations before recovering the original count. -->
  <g fill="none" stroke="#8ab4f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 58h13q9 0 9 9v24q0 9 9 9h22"/>
    <path d="M110 142h13q9 0 9-9v-24q0-9 9-9"/>
    <path d="m157 95 6 5-6 5"/>
  </g>
  <!-- H(t)=8+8t+t²: open samples at -1 and 1, recovered value at 0. -->
  <rect x="170" y="21" width="137" height="158" rx="9" fill="#fff" stroke="#8ab4f8" stroke-width="2"/>
  <text x="238.5" y="50" fill="#185abc" font-family="'Roboto Flex', Roboto, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">H(0) = 8</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M182 64v103h113" stroke="#d2e3fc" stroke-width="2"/>
    <path d="M239 166v-42" stroke="#8ab4f8" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="M268 97.5 298 64.9" stroke="#8ab4f8" stroke-width="2"/>
    <path d="M193 159Q239 129 285 79" stroke="#1a73e8" stroke-width="3"/>
  </g>
  <g fill="#fff" stroke="#1a73e8" stroke-width="2.5">
    <circle cx="193" cy="159" r="4.5"/>
    <circle cx="285" cy="79" r="4.5"/>
  </g>
  <circle cx="239" cy="124" r="9" fill="#e8f0fe"/>
  <circle cx="239" cy="124" r="5" fill="#1a73e8"/>
</svg>
