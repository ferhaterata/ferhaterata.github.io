<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>Learning How to Cube</title>
  <desc>The CNF formula (p or q) and (not p or r) branches on p into two smaller cube subproblems.</desc>
  <rect width="320" height="200" fill="#f4f8ff"/>
  <g fill="#185abc" font-family="Georgia, 'Times New Roman', serif" font-size="31" text-anchor="middle">
    <text x="160" y="40">(p ∨ q) ∧</text>
    <text x="160" y="77">(¬p ∨ r)</text>
  </g>
  <g fill="none" stroke="#8ab4f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 89v15H94v25M160 104h66v25"/>
  </g>
  <g fill="#185abc" font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle">
    <text x="70" y="119">p</text>
    <text x="252" y="119">¬p</text>
  </g>
  <g stroke="#1a73e8" stroke-width="2" stroke-linejoin="round">
    <path d="m94 129 28 16-28 16-28-16z" fill="#e8f0fe"/>
    <path d="m66 145 28 16v28l-28-16z" fill="#b8d1fa"/>
    <path d="m94 161 28-16v28l-28 16z" fill="#5c99ee"/>
    <path d="m226 129 28 16-28 16-28-16z" fill="#e8f0fe"/>
    <path d="m198 145 28 16v28l-28-16z" fill="#b8d1fa"/>
    <path d="m226 161 28-16v28l-28 16z" fill="#5c99ee"/>
  </g>
</svg>
