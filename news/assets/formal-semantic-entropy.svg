<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <title>Formal Semantic Entropy</title>
  <desc>Formalized responses are grouped by logical equivalence, then their group frequencies define an entropy H. In this illustrative example with no additional assumptions, p implies q and not p or q share one group, while q implies p belongs to another. The bars represent group counts of two and one. Equivalence compares the represented meanings; it does not certify their correctness. Based on the Formal Semantic Entropy method in Self-Brier and Formal Semantic Entropy.</desc>
  <rect width="320" height="200" fill="#f4f8ff"/>
  <g fill="none" stroke="#8ab4f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 45h18l24 40M124 100h37M124 155h18l24-40"/>
    <path d="M209 100h18m-5-5 5 5-5 5"/>
  </g>
  <g fill="#e8f0fe" stroke="#8ab4f8" stroke-width="2">
    <rect x="16" y="26" width="108" height="38" rx="8"/>
    <rect x="16" y="81" width="108" height="38" rx="8"/>
  </g>
  <rect x="16" y="136" width="108" height="38" rx="8" fill="#d2e3fc" stroke="#8ab4f8" stroke-width="2"/>
  <g fill="#185abc" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" font-size="23">
    <text x="70" y="53">p → q</text>
    <text x="70" y="108">¬p ∨ q</text>
    <text x="70" y="163">q → p</text>
  </g>
  <circle cx="185" cy="100" r="24" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <path d="M175 92h20M175 100h20M175 108h20" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M235 69v73h71" fill="none" stroke="#8ab4f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="242" y="75" width="24" height="66" rx="3" fill="#8ab4f8" stroke="#1a73e8" stroke-width="2"/>
  <rect x="278" y="108" width="24" height="33" rx="3" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/>
  <g fill="#185abc" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="272" y="53" font-size="29">H</text>
    <text x="254" y="163" font-size="17">C₁</text>
    <text x="290" y="163" font-size="17">C₂</text>
  </g>
</svg>
