<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 312 164">
  <title>Learning Randomized Reductions</title>
  <desc>Schematic randomized self-reduction. An input x branches into two queries using shared randomness r. The learned reconstruction rule R combines their function values to recover f(x). A checkmark represents formal verification. The number of queries is illustrative. Source: https://arxiv.org/abs/2412.18134.</desc>
  <rect width="320" height="200" fill="#f4f8ff"/>
  <g fill="none" stroke="#8ab4f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 100h10l20-42M48 100l20 42"/>
    <path d="M178 58h8l19 30M178 142h8l19-30"/>
    <path d="M236 100h18m-5-5 5 5-5 5"/>
  </g>
  <circle cx="22" cy="100" r="16" fill="#e8f0fe" stroke="#8ab4f8" stroke-width="2"/>
  <g fill="#e8f0fe" stroke="#8ab4f8" stroke-width="2">
    <rect x="68" y="35" width="110" height="46" rx="8"/>
    <rect x="68" y="119" width="110" height="46" rx="8"/>
  </g>
  <circle cx="219" cy="100" r="17" fill="#b8d1fa" stroke="#1a73e8" stroke-width="2"/>
  <rect x="255" y="77" width="59" height="46" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="2"/>
  <g fill="#185abc" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="22" y="108" font-size="25">x</text>
    <text x="123" y="22" font-size="18">r ∼ U</text>
    <text x="123" y="64" font-size="18">f(q₁(x,r))</text>
    <text x="123" y="148" font-size="18">f(q₂(x,r))</text>
    <text x="219" y="108" font-size="24">R</text>
    <text x="284" y="108" font-size="23">f(x)</text>
  </g>
  <circle cx="287" cy="137" r="14" fill="#1a73e8"/>
  <path d="m280 137 5 5 9-11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
