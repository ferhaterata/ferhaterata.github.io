    <title id="title">Shared policy backbone with semantic diff underneath</title>
    <desc id="desc">Two policy documents on the left feed into a shared abstraction function on the right. A semantic diff sits directly below that function in the same right-hand column. The combined right-hand stack is vertically centered against the two input documents. Policy A uses 100 as its usage limit; Policy B uses (- budget reserve). Only those limit subterms are highlighted in the diff; the common comparison and sum are shown identically.</desc>
